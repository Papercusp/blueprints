# The `bee` launch blueprint — local-hive-orchestration-2026-06-06 (P-010 / P-011, D-001/D-003/D-009).
#
# A SINGLE-ROLE LAUNCH BLUEPRINT (D-007): the Queen's "place a fresh generic worker"
# primitive (placement option 1 — free slot). Firing it is `fleet:spawn { role:'bee',
# harness:<slug>, extras:[...] }` (or fireLaunchBlueprint('bee') with a parent) — it
# launches ONE generic implementation agent (the `bee` role) into a registered
# project, with the Queen's brief riding `extras` and the bee's persona resolved from
# the global prompts/bee.md.
#
# kind:'harness' (the DEFAULT, stated here for clarity): a bee is NOT a hive. The
# privileged kind:'hive' is the Queen (`pot`) alone — it is launchable only as a root,
# and the no-nest guard (assertNotNestedHive) would reject it under a parent. A bee,
# being kind:'harness', is freely launchable by the Queen and may itself spin up a
# kind:'harness' subharness for structured work (D-017) — but never another hive.
#
# Extends `single-agent`: it inherits the run-to-done single-role spine (one decider
# + DONE/ESCALATE/IDLE edges + inline planner) + the governed + durable launch
# contract (spawnInvokeOnce chokepoint → brain-decided admission + the safety floor).
# It overrides ONLY the decider role (`bee`) and the turn budget.
id: bee
extends: single-agent
kind: harness
version: 0.1.0
description: >-
  Launch one generic Hive worker (the `bee` role) — a plain implementation agent the
  Queen places ranked work + a brief onto. Decoupled from the pipeline guards (no
  chunk, no spine); the brief rides `extras`, the persona is prompts/bee.md. A bee is
  kind:'harness' (NOT a hive).

# The work the bee is placed onto. Generic: a bee is given tasks, not a typed
# pipeline feature — `kind:'task'` is the plain "do this" work unit.
workItem:
  kind: task
  idPrefix: BEE

# Spine edges + planner inherited from `single-agent`; override the decider role +
# the bee's turn budget only. The bee runs its placed work to done/escalate/idle and
# (when idle) registers a coord:await-inbox wake before sleeping (persona-driven).
spine:
  decider: bee
  maxTurns: 80

roles:
  - id: bee
    description: >-
      The generic Hive worker: read your brief (rides extras) + your ranked
      work-list (work_items), do the work owning your own sequencing (propose/
      dispose), publish your ordered list on the blackboard so the Queen can
      supervise, coordinate via coord, and register coord:await-inbox when you end a
      turn idle. Persona: prompts/bee.md (global — no blueprint-scoped override).

knobs:
  harnessKind: bee
  # A bee implements against a project cwd, so it needs a registered repo (the
  # generic-worker launch path — local-hive P-002 leans "register"). It does NOT
  # need the coding pipeline; requiresRepo just gates the cwd resolution.
  requiresRepo: true

# NO `triggers` — a bee is PLACED by the Queen on demand (fleet:spawn /
# fireLaunchBlueprint), not fired on a cadence or an event. The Queen's placement
# loop IS its trigger.

# Dependencies — the generic worker surface a bee uses regardless of task: its
# ordered work-list (work_items), coordination + the idle-wake scaffold (coord),
# grounding reads (plans/docs/search), the blueprint catalog for spinning up a
# structured subharness, and the friction-capture intake (self-learning loop).
dependencies:
  tools:
    - agent_tools:list
    - blueprint:catalog
    - blueprint:validate
    - coord:await-inbox
    - coord:declare-intent
    - coord:inbox
    - coord:send
    - docs:get
    - docs:search
    - harness:create
    - harness:get
    - harness:list
    - improvements:capture
    - memory:remember
    - memory:search
    - plans:get
    - search:fulltext
    - search:semantic
    - work_items:claim
    - work_items:complete
    - work_items:create
    - work_items:get
    - work_items:list
    - work_items:reorder
  plugins: []
